name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          ZIP=$(ls -1 *.zip | head -n 1)
          echo "Using $ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          DIR=extracted
          if [ "$(ls -1 extracted | wc -l)" -eq 1 ] && [ -d "extracted/$(ls -1 extracted)" ]; then
            DIR="extracted/$(ls -1 extracted)"
          fi
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MyNotes-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
